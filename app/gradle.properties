# CAS server version
cas.version=8.0.1

###############################
# Spring versions
###############################
springBootVersion=4.1.0

###############################
# Tomcat versions
###############################
tomcatVersion=11.0.25

commons-lang3.version=3.19.0

# Trivy CRITICAL fixes; old copies in the base CAS WAR are excluded in springboot.gradle.
# CVE-2026-22732
spring-security.version=6.5.9
# CVE-2026-40477 / CVE-2026-40478 / CVE-2026-41901
thymeleaf.version=3.1.5.RELEASE

# Use -jetty, -undertow to other containers
# Or blank if you want to deploy to an external container
appServer=-tomcat
executable=false

# plugins versions
gradleFreeFairPluginVersion=9.5.0
gradleDependencyManagementPluginVersion=1.1.5

# The version of this overlay project
version=8.0.1
group=org.apereo.cas
artifactId=cas-overlay
sourceCompatibility=25
targetCompatibility=25

# Location of the downloaded CAS shell JAR
shellDir=build/libs
ivyVersion=2.5.0
gradleDownloadTaskVersion=4.1.1
gradleMavenPluginVersion=5.2.1
gradleLombokPluginVersion=5.2.1

# use without "-slim" in tag name if you want tools like jstack, adds about 100MB to image size
# (https://hub.docker.com/r/adoptopenjdk/openjdk11/tags/)
baseDockerImage=eclipse-temurin:25-jdk-alpine
allowInsecureRegistries=false
dockerImagePlatform=amd64:linux

# Include private repository
# override these in user properties or pass in values from env on command line
privateRepoUrl=
privateRepoUsername=
